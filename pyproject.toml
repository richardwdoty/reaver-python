[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reaver"
version = "0.1.0"
description = "REAVER vascular analysis toolkit"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "pillow",
]