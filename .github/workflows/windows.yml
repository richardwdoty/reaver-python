name: Windows application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/windows-requirements.txt
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: REAVER-Windows-x64
          path: |
            dist/REAVER-Windows-x64.zip
            dist/REAVER-Windows-x64.sha256
